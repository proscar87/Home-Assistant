name: Mac bridge tests

on:
  push:
    paths:
      - 'Other Home Assistant Projects/Mac Dashboard/mac2mqtt/**'
      - '.github/workflows/mac-bridge.yml'
  pull_request:
    paths:
      - 'Other Home Assistant Projects/Mac Dashboard/mac2mqtt/**'
      - '.github/workflows/mac-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'Other Home Assistant Projects/Mac Dashboard/mac2mqtt/go.mod'
          cache-dependency-path: 'Other Home Assistant Projects/Mac Dashboard/mac2mqtt/go.sum'
      - name: Run bridge tests
        working-directory: Other Home Assistant Projects/Mac Dashboard/mac2mqtt
        run: go test -mod=readonly -count=1 ./...
