name: Outage Map validation
on:
  push:
    paths:
      - 'custom_components/outage_watch/**'
      - 'tests/**'
      - 'scripts/validate_catalog.py'
      - 'hacs.json'
      - '.github/workflows/outage-map.yml'
  pull_request:
    paths:
      - 'custom_components/outage_watch/**'
      - 'tests/**'
      - 'scripts/validate_catalog.py'
      - 'hacs.json'
      - '.github/workflows/outage-map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python scripts/validate_catalog.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components
      - run: node --check custom_components/outage_watch/www/outage-watch-card.js
      - run: node --test tests/outage-chart.test.cjs
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The beta is URL-only. Its MIT license is scoped to Outage Map.
          ignore: brands license
          comment: 'false'
