add_service:
  name: Track a service
  fields:
    catalog_id:
      selector:
        text:
    name:
      selector:
        text:
    url:
      selector:
        text:
remove_service:
  name: Stop tracking a service
  fields:
    service_id:
      required: true
      selector:
        text:
set_alerts:
  name: Set service alerts
  fields:
    service_id:
      required: true
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:

    phone:
      description: Registered mobile_app notification action name for first-time setup.
      selector:
        text:
set_tracking_paused:
  name: Pause or resume endpoint checks
  fields:
    service_id:
      required: true
      selector:
        text:
    paused:
      required: true
      selector:
        boolean:

enable_readouts:
  name: Enable dashboard readouts
  description: Set up the Home Assistant provider for Speedtest or server metrics.
  fields:
    provider:
      required: true
      selector:
        select:
          options:
            - speedtestdotnet
            - systemmonitor
